[project]
name = "game-script-dev"
version = "0.1.0"
description = "Profile-driven local automation runner for repetitive game UI workflows."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
opencv = [
    "opencv-python>=4.10",
]

[project.scripts]
game-script-dev = "game_script_dev.cli:main"
game-script-dev-dashboard = "game_script_dev.dashboard.server:main"

[tool.setuptools.package-data]
game_script_dev = ["dashboard/static/*"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
