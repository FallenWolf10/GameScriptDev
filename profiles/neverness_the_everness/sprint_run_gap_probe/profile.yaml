version: 1
name: NevernessTheEverness Sprint Run Gap Probe

profile_pack:
  game: NevernessTheEverness
  game_mode: Sprint Run Gap Probe
  detection_strategy: template_matching
  known_limitations:
    - This pack assumes the client is already on a safe in-world screen with the character fully stopped before the run begins.
    - This pack does not include visual anchors, so live success means the timed input sequence completed without adapter failure, not that sprint onset was visually confirmed by the profile itself.
    - The tested variable in this pack is the delay from `Shift` down to `W` down while `Shift` remains held through the forward burst.
    - The pack does not automatically reset the character to the exact same start point between trials, so the operator must review the run log together with live observation.
    - Foreground input is used intentionally for movement-sensitive timing experiments and requires the NTE window to stay focusable.
    - This pack is limited to local operator-approved input timing experiments and does not automate progression, farming, or evasive behavior.
  compatibility:
    target_identity: true
    supported_resolution: true
    required_assets: true
    full_state_graph: true
    terminal_states: true
    failure_transitions: true
    interruption_recovery: true
    known_limitations: true
    successful_validation_or_dry_run: true

target:
  window_title_contains: NTE
  input_mode: foreground
  foreground_key_method: sendinput_vk

window:
  resolution:
    width: 1280
    height: 720
    policy: ignore

execution:
  default_timeout_seconds: 20
  max_retries: 1

initial_state: baseline_walk

states:
  baseline_walk:
    actions:
      - type: log
        message: "Baseline walk: hold W for 0.80s without Shift."
      - type: hold_key
        key: w
        seconds: 0.8
      - type: wait
        seconds: 1.0
    on_success: gap_000
    on_failure: failed_probe

  gap_000:
    actions:
      - type: log
        message: "Trial gap 0.00s: hold Shift for 0.80s total, then press W immediately for 0.80s."
      - type: start_continuous_input
        name: sprint_hold_gap_000
        action: hold_key
        key: shift
        stop_after_seconds: 0.8
      - type: hold_key
        key: w
        seconds: 0.8
      - type: wait
        seconds: 1.0
    on_success: gap_003
    on_failure: failed_probe

  gap_003:
    actions:
      - type: log
        message: "Trial gap 0.03s: hold Shift for 0.83s total, wait 0.03s, then hold W for 0.80s."
      - type: start_continuous_input
        name: sprint_hold_gap_003
        action: hold_key
        key: shift
        stop_after_seconds: 0.83
      - type: wait
        seconds: 0.03
      - type: hold_key
        key: w
        seconds: 0.8
      - type: wait
        seconds: 1.0
    on_success: gap_005
    on_failure: failed_probe

  gap_005:
