version: 1
name: NevernessTheEverness Pink Paw Test Route

profile_pack:
  game: NevernessTheEverness
  game_mode: Pink Paw Test Route
  detection_strategy: template_matching
  known_limitations:
    - Reconstructed from two short recordings captured on 2026-06-02; this is a compact test route, not the longer Pink Paw automation route.
    - The profile assumes the player starts beside the Pink Paw NPC with the interaction prompt already visible.
    - Menu and confirmation actions use fixed click regions reviewed at 1280x720; UI scale or language changes may require new anchors and regions.
    - The route is intentionally prompt and menu driven. It does not attempt to replay fine movement or mouse-look input.
    - Exit confirmation is scripted as part of this test route because the recording exits the instance shortly after entry.
  compatibility:
    target_identity: true
    supported_resolution: true
    required_assets: true
    full_state_graph: true
    terminal_states: true
    failure_transitions: true
    interruption_recovery: true
    known_limitations: true
    successful_validation_or_dry_run: true

target:
  process_name: HTGame.exe
  window_title_contains: NTE
  input_mode: background_window_messages
  use_qwerty_physical_keys: true

window:
  resolution:
    width: 1280
    height: 720
    policy: verify_only

execution:
  default_timeout_seconds: 20
  max_retries: 1

regions:
  npc_join_option:
    x: 872
    y: 318
    width: 360
    height: 52
  event_enter_button:
    x: 784
    y: 650
    width: 410
    height: 46
  exit_confirm_button:
    x: 654
    y: 470
    width: 236
    height: 46

initial_state: npc_prompt_start

states:
  npc_prompt_start:
    required_anchors:
      - name: pink_paw_npc_prompt
        type: template
        asset: assets/start_npc_prompt.png
    actions:
      - type: log
        message: Starting Pink Paw test route at NPC prompt.
      - type: start_continuous_input
        name: press_f
        action: press_key
        key: f
        repeat_every_seconds: 0.2
        seconds: 0.1
        stop_after_seconds: 2.0
      - type: wait
        seconds: 1.5
      - type: start_continuous_input
        name: press_esc
        action: press_key
        key: esc
        repeat_every_seconds: 0.2
        seconds: 0.1
        stop_after_seconds: 1.0
      - type: wait
        seconds: 0.5
      - type: start_continuous_input
        name: keep_clicking
        action: click_point
        region: event_enter_button
        input_mode: foreground
        repeat_every_seconds: 0.2
        stop_after_seconds: 1.0
      - type: wait
        seconds: 0.5
      - type: wait_for_state
        state: event_entered
        timeout_seconds: 30
        poll_interval_seconds: 0.1
    on_success: event_entered
    on_failure: failed_route

  event_entered:
    required_anchors:
      - name: skip_button
        type: template
        asset: assets/skip_button.png
    actions:
      - type: log
        message: Entered the event; skipping cutscene and waiting for the exit confirmation dialog.
      - type: start_continuous_input
        name: press_esc
        action: press_key
        key: esc
        repeat_every_seconds: 0.2
        seconds: 0.1
        stop_after_seconds: 1.0
      - type: wait
        seconds: 0.5
      - type: start_continuous_input
        name: keep_clicking
        action: click_point
        region: exit_confirm_button
        input_mode: foreground
        repeat_every_seconds: 0.2
        stop_after_seconds: 1.0
      - type: wait
        seconds: 0.5
      - type: wait_for_state
        state: exit_confirm
        timeout_seconds: 30
        poll_interval_seconds: 0.1
    on_success: exit_confirm
    on_failure: failed_route

  exit_confirm:
    required_anchors:
      - name: return_confirm
        type: template
        asset: assets/return_npc_prompt.png
    terminal: true
    result: success
  failed_route:
    terminal: true
    result: failed_pink_paw_test_route
