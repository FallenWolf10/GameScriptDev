version: 1
name: Invalid Bid King Unbounded Control

target:
  window_title_contains: SAFE PLACEHOLDER

window:
  resolution:
    width: 1
    height: 1
    policy: ignore

execution:
  max_retries: 1
  allow_infinite_run: false

initial_state: control
states:
  control:
    actions:
      - type: wait
        seconds: 0.1
    on_success: control
    on_failure: control
