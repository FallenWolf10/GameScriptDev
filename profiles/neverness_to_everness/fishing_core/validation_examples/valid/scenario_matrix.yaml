version: 1
profile: ../../profile.yaml
purpose: Safe local scenario expectations for focused adapter-driven tests.
scenarios:
  caught:
    expected_result: caught
    correction_sequence: [right]
  escaped:
    expected_result: escaped
    correction_sequence: [right]
  lost_state:
    expected_result: lost_state
    correction_sequence: [right]
  retry_failure:
    expected_result: failed_control_timeout
    correction_sequence: [right, left]
  operator_stop:
    expected_result: operator_stopped
    correction_sequence: []
