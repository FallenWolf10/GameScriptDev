version: 1
name: Local Demo Target

profile_pack:
  game: GameScriptDev Demo
  game_mode: Local Target
  detection_strategy: template_matching
  known_limitations:
    - Local demo target only; not a real game or external service.
    - Tk window decoration size may vary, so the demo profile ignores outer-window resolution while using a fixed 1280x720 client area.
  compatibility:
    target_identity: true
    supported_resolution: true
    required_assets: true
    full_state_graph: true
    terminal_states: true
    failure_transitions: true
    interruption_recovery: true
    known_limitations: true
    successful_validation_or_dry_run: true

target:
  window_title_contains: Demo Automation Window
  input_mode: background_window_messages

window:
  resolution:
    width: 1280
    height: 720
    policy: ignore

execution:
  default_timeout_seconds: 30
  max_retries: 3

regions:
  daily_button:
    x: 510
    y: 420
    width: 260
    height: 72

initial_state: home_screen

states:
  home_screen:
    required_anchors:
      - name: home_title
        type: template
        asset: assets/home_marker.ppm
    forbidden_anchors:
      - name: maintenance_banner
        type: template
        asset: assets/known_failure_marker.ppm
    actions:
      - type: log
        message: Demo starts from the home screen.
      - type: wait
        seconds: 0
      - type: click_point
        region: daily_button
      - type: wait_for_state
        state: daily_menu
    on_success: daily_menu
    on_failure: known_failure

  daily_menu:
    required_anchors:
      - name: daily_menu_title
        type: template
        asset: assets/daily_menu_marker.ppm
    actions:
      - type: press_key
        key: F
      - type: hold_key
        key: W
        seconds: 2
      - type: wait_for_state
        state: completion_popup
    on_success: completion_popup

  completion_popup:
    required_anchors:
      - name: completion_title
        type: template
        asset: assets/completion_marker.ppm
    terminal: true
    result: success

  known_failure:
    required_anchors:
      - name: known_failure_title
        type: template
        asset: assets/known_failure_marker.ppm
    terminal: true
    result: failed_known_screen

interruptions:
  - name: network_disconnect
    required_anchors:
      - name: disconnect_message
        type: template
        asset: assets/interruption_marker.ppm
    recovery_actions:
      - type: log
        message: Would close the disconnect popup in live mode.
    max_retries: 1
