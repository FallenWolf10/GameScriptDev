version: 1
name: Demo Profile

target:
  process_name: demo.exe
  window_title_contains: Demo Automation Window

window:
  resolution:
    width: 1280
    height: 720
    policy: verify_only

execution:
  default_timeout_seconds: 30
  max_retries: 3

regions:
  daily_button:
    x: 510
    y: 420
    width: 260
    height: 72

initial_state: home_screen

states:
  home_screen:
    required_anchors:
      - name: home_title
        type: text
        text: Home
    forbidden_anchors:
      - name: maintenance_banner
        type: text
        text: Maintenance
    actions:
      - type: log
        message: Demo starts from the home screen.
      - type: wait
        seconds: 0
      - type: click_point
        region: daily_button
      - type: wait_for_state
        state: daily_menu
    on_success: daily_menu
    on_failure: known_failure

  daily_menu:
    required_anchors:
      - name: daily_menu_title
        type: text
        text: Daily Tasks
    actions:
      - type: press_key
        key: F
      - type: hold_key
        key: W
        seconds: 2
      - type: wait_for_state
        state: completion_popup
    on_success: completion_popup

  completion_popup:
    required_anchors:
      - name: completion_title
        type: text
        text: All Tasks Completed
    terminal: true
    result: success

  known_failure:
    required_anchors:
      - name: known_failure_title
        type: text
        text: Known Failure
    terminal: true
    result: failed_known_screen

interruptions:
  - name: network_disconnect
    required_anchors:
      - name: disconnect_message
        type: text
        text: Network disconnected
    recovery_actions:
      - type: log
        message: Would close the disconnect popup in live mode.
    max_retries: 1
