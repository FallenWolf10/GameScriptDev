version: 1
name: Invalid Action Duration Example

target:
  process_name: demo.exe

window:
  resolution:
    width: 1280
    height: 720

initial_state: home

states:
  home:
    required_anchors:
      - name: home_title
        type: text
        text: Home
    actions:
      - type: wait
        seconds: nope
    terminal: true
    result: success
